name: Daily beachcombing check

# Computes today's score (+3-day forecast), commits it to data/history.json,
# and sends a Telegram alert ONLY on a PRIME day. See README for setup.

on:
  schedule:
    # GitHub cron is UTC. Two runs bracket the DST boundary so exactly one lands
    # at 07:30 local year-round; EXACT_LOCAL_HOUR below makes the other early-exit.
    #   30 18 UTC -> 07:30 NZDT (summer, UTC+13) / 06:30 NZST (winter) — runs in summer
    #   30 19 UTC -> 08:30 NZDT (summer)          / 07:30 NZST (winter) — runs in winter
    - cron: '30 18 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch: {}

# Least privilege: only the history commit needs write access.
permissions:
  contents: write

# Never run two daily checks at once (avoids commit races).
concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily check
        run: npm run daily-check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # Locks SCHEDULED runs to 07:30 local: whichever cron lands on local hour
          # 07 does the work, the other early-exits. Empty for manual dispatch so a
          # workflow_dispatch always does real work regardless of the hour.
          EXACT_LOCAL_HOUR: ${{ github.event_name == 'schedule' && '7' || '' }}

      - name: Commit history if changed
        run: |
          if git diff --quiet -- data/history.json; then
            echo "No history change to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: record daily beachcombing snapshot [skip ci]"
            git push
          fi
