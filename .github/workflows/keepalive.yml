name: Keepalive

# GitHub automatically disables a scheduled (cron) workflow after 60 days with
# no repository commit activity. The daily-check job normally commits a snapshot
# every day, which is enough to keep every scheduled workflow enabled — so this
# is a safety net for the case where that job goes silent for weeks (e.g. an
# upstream outage or a bug). It only acts when the newest commit is ≥50 days
# old, pushing a single empty commit to reset the clock well before the 60-day
# cutoff. In normal operation it is a no-op and adds nothing to history.

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC — weekly is ample for a 50-day threshold.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Commit only if the repo has gone quiet
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Newest commit is ${age_days} day(s) old."
          if [ "$age_days" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to keep scheduled workflows enabled [skip ci]"
            git push
            echo "Pushed keepalive commit."
          else
            echo "Under 50 days — no keepalive needed."
          fi
